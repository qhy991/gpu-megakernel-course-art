<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="{{ page.og_type | default: 'website' }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:image" content="{{ page.image | default: '/assets/images/course-hero.png' | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <title>{{ page.title | default: site.title }}{% unless page.title == site.title %} · {{ site.title }}{% endunless %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;900&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/course.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="site-header">
    <div class="shell nav-wrap">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="GPU Megakernel 实战课首页">
        <span class="brand-mark">MK</span>
        <span><strong>GPU Megakernel 实战课</strong><small>Evidence-driven · Beginner-friendly</small></span>
      </a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-menu-toggle><span></span><span></span><b class="sr-only">打开导航</b></button>
      <nav id="site-nav" class="site-nav" data-menu>
        <a href="{{ '/' | relative_url }}">课程首页</a>
        <a href="{{ '/evidence/' | relative_url }}">证据规则</a>
        <a href="{{ '/about/' | relative_url }}">关于课程</a>
        <a href="https://qhy991.github.io/">个人主页 ↗</a>
      </nav>
    </div>
  </header>
  <main id="main">{{ content }}</main>
  <footer class="site-footer">
    <div class="shell footer-grid">
      <div><strong>GPU Megakernel 实战课</strong><p>把 GPU 优化从“猜一个技巧”变成“建立证据链”。</p></div>
      <div class="footer-links"><a href="https://github.com/qhy991/gpu-megakernel-course-art">GitHub</a><a href="https://qhy991.github.io/blog.html">Notes</a><a href="{{ '/evidence/' | relative_url }}">Evidence</a></div>
      <p>© 2026 Haiyan Qin</p>
    </div>
  </footer>
  <script src="{{ '/assets/js/course.js' | relative_url }}" defer></script>
</body>
</html>
